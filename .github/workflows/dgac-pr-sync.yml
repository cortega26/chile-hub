name: DGAC PR canonical documentation sync
# One-shot rerun after registering the new extractor in doc_sync.

on:
  push:
    branches: [feat/publish-dgac-precipitations-layer-20261017]
    paths:
      - ".github/workflows/dgac-pr-sync.yml"

permissions:
  contents: write

jobs:
  sync-once:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout contributor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/publish-dgac-precipitations-layer-20261017
          fetch-depth: 0
      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: |
          python -m pip install "polars>=1.44.1,<3" "pyarrow>=24" "requests>=2.34.2" "platformdirs>=4" "rich>=14"
      - name: Generate canonical README, AGENTS and dataset documentation
        run: python scripts/sync_docs.py
      - name: Check generated docs and other countable facts
        run: |
          python scripts/sync_docs.py --check
          python scripts/check_agents_sync.py
          python scripts/check_landing_sync.py
      - name: Commit canonical changes to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md docs/
          if ! git diff --cached --quiet; then
            git commit -m "docs(dgac): synchronize generated facts, contracts and schemas"
            git pull --rebase origin feat/publish-dgac-precipitations-layer-20261017
            git push origin HEAD:feat/publish-dgac-precipitations-layer-20261017
          fi
