name: Debug 133a import

on:
  push:
    branches: [audit/133a-single-source]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/133a-single-source

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Sync env
        run: uv sync --extra pipeline --extra dev

      - name: Ground truth
        run: |
          echo "==== ls extractors ===="
          ls -la src/extractors/ | grep -iE "shared|autoridades" || true
          echo "==== os.listdir desde python ===="
          python -c "import os; print(sorted(os.listdir('src/extractors')))"
          echo "==== import full ===="
          python -c "from src.extractors.authoridades_shared import SCHEMA; print('full OK', len(SCHEMA))" || echo "FULL FALLA"
          echo "==== import pkg ===="
          python -c "from src.extractors import autoridades_shared; print('pkg OK', len(autoridades_shared.SCHEMA))" || echo "PKG FALLA"
          echo "==== git ===="
          git log -1 --format="%H %s" -- src/extractors/autoridades_shared.py
          git status --short
          echo "==== sha del archivo ===="
          sha256sum src/extractors/autoridades_shared.py
          echo "==== archivo crudo (primeras 6 lineas) ===="
          head -6 src/extractors/autoridades_shared.py
          echo "==== ¿pyc presente tras sync? ===="
          ls -la src/extractors/__pycache__/ 2>/dev/null | grep -iE "autoridades_shared|electas" || echo "(sin pycache)"
