name: Dependabot Lock Sync

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-lock:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token del PR necesita push; checkout del head del PR
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Check if lock is stale
        id: check
        run: |
          if uv lock --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "uv.lock al día"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "uv.lock desactualizado — regenerando"
          fi

      - name: Regenerate lock
        if: steps.check.outputs.stale == 'true'
        run: uv lock

      - name: Commit updated lock
        if: steps.check.outputs.stale == 'true'
        env:
          # El ref del PR pasa por env (no interpolado en el shell): un branch
          # con metacaracteres rompería/inyectaría el comando con `contents: write`.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- uv.lock; then
            echo "Sin cambios en uv.lock tras uv lock"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(deps): sync uv.lock [skip ci]"
          git push origin "HEAD:$HEAD_REF"
