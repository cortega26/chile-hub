repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # data/raw/ son snapshots de auditoria solo-append (AGENTS.md, regla #3):
      # ningun hook debe reescribirlos. Ademas son binarios (xlsx/rar), donde
      # "trailing whitespace" no significa nada.
      - id: trailing-whitespace
        exclude: ^data/raw/
      - id: end-of-file-fixer
        exclude: ^data/raw/
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-json

  # ruff y mypy corren con `uv run` (dev-pin de pyproject + uv.lock): una sola
  # superficie de versión, igual que pip-audit/interrogate/bandit. Antes había
  # tres (pyproject, rev de pre-commit, uvx ruff@ del workflow) y cada bump de
  # Dependabot dejaba main rojo hasta alinear a mano; ADR-024 eliminó la
  # duplicación en vez de sincronizarla.
  # Guardrail: tests/test_ci_config.py::SingleSourceToolingGuardrailTests.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check
        args: [--fix, --exit-non-zero-on-fix]
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: sync-docs
        name: sync-docs
        entry: bash -c 'make sync-docs && git add README.md AGENTS.md'
        language: system
        pass_filenames: false
        # Patrones de archivo (no solo directorios): con `tests/` el `$` ancla
        # el match al nombre literal del directorio y `tests/test_x.py` jamas
        # dispara el hook. Guardrail: SyncDocsHookTriggerTests.
        files: ^(pyproject\.toml|README\.md|AGENTS\.md|src/chile_hub/datasets\.py|src/builders/.*|scripts/sync_docs\.py|docs/adr/.*|tests/.*|data/dataset_catalog_config\.json|contracts/datasets/.*)$
      - id: pip-audit
        name: pip-audit
        # Mismos flags que CI: sin ignores. PYSEC-2026-2132 quedó resuelto al
        # subir python-semantic-release a 10.7.0 (click>=8.1,<8.6 → click 8.4.2),
        # que era la razón del ignore temporal de Plan 096.
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        files: ^pyproject\.toml$
      - id: interrogate
        name: interrogate
        entry: uv run interrogate
        language: system
        pass_filenames: false
        files: ^src/chile_hub/
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r src/
        language: system
        pass_filenames: false
        files: ^src/
