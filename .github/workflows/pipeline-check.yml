name: Pipeline Check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    # Requerido por la merge queue (branch protection "Require merge queue"):
    # la cola crea ramas temporales gh-readonly-queue/main/... y dispara el
    # evento merge_group; sin este trigger los checks requeridos nunca se
    # reportan y la cola falla todos los merges.
  schedule:
    # GitHub cron is UTC: 06:00 CLT or 07:00 CLST.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish fresh live artifacts to main
        required: false
        type: boolean
        default: false
      allow_stale_backfills:
        description: "Codigo_indicador(s) separados por coma cuyo published_backfill stale se acepta (ADR-016). Ej: ipc"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  PIPELINE_ARTIFACT: pipeline-output-${{ github.run_id }}

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  # En merge_group NO se cancela: la cola prueba varios PRs en paralelo en
  # ramas temporales distintas (cada una con su propio ref/grupo), y cancelar
  # los builds en curso romperia la formacion de grupos de la cola.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  quality:
    name: Python quality
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: quality

      - name: Install dev dependencies
        run: uv sync --extra pipeline --extra dev

      - name: Type check (mypy)
        run: uv run mypy

      - name: Security scan (bandit)
        run: uv run bandit -c pyproject.toml -r src/

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

      - name: Docstring coverage (informational)
        run: uv run interrogate --fail-under=80 src/chile_hub || true

      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --locked

      - name: Check Python lint
        run: uvx ruff@0.15.17 check src/ tests/ scripts/

      - name: Check Python format
        run: uvx ruff@0.15.17 format --check src/ tests/ scripts/

      - name: Check dataset registry/docs/contracts sync
        run: python scripts/check_companion_paths.py registry

      - name: Check docs sync (README hardcoded facts)
        # Gate read-only (job quality sin contents: write): el auto-heal vive
        # en el job separado docs-autosync, que solo corre en push a main.
        # Aqui el gate es bloqueante en todas las vias (incluido push a main:
        # el job docs-autosync commitea el fix despues y el siguiente run ya
        # parte consistente).
        run: python scripts/sync_docs.py --check

      # Adelanta a cada push/PR la deriva que "Check build-synced files" solo
      # detecta en la vía schedule, tras un build completo (ver #270 con
      # autoridades_locales y 56cd9d5 con geometria_comunal).
      - name: Check landing sync (JSON-LD/app.js derivados del catálogo)
        run: python scripts/check_landing_sync.py

      # AGENTS.md es prosa curada (no bloque delimitado): verifica sus hechos
      # contables (anclas de líneas, listas de módulos, tabla de capas del §1)
      # contra el código — el caso real que motivó este gate fue la deriva de
      # conteos de líneas y módulos en el árbol del §2 (2026-08).
      - name: Check AGENTS.md countable facts
        run: python scripts/check_agents_sync.py

      - name: Fetch PR base commit for companion-path diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Check companion paths (docs/tests co-change)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/check_companion_paths.py companions \
            --base "${{ github.event.pull_request.base.sha }}"

  # Auto-heal de docs SOLO en push a main. Job separado con contents: write:
  # el job quality se mantiene read-only, de modo que un PR de una rama del
  # repo no puede ejecutar codigo controlado por el PR con un token de
  # escritura (P1 de la review del PR #60). Este job corre el codigo de main
  # (push ya aprobado), nunca el de una rama de PR.
  docs-autosync:
    concurrency:
      group: bot-writes-main
      cancel-in-progress: false
    name: Auto-sync docs (push a main)
    # Corre incluso si quality falla: su proposito es arreglar el drift de docs
    # que quality detecto (la causa habitual: carrera con un release). Si
    # quality fallo por otra razon, el auto-sync no encontrara drift y no
    # hara nada (el step valida con --check antes de tocar nada).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: docs-autosync

      - name: Install dev dependencies
        run: uv sync --extra pipeline --extra dev

      - name: Auto-sync docs if stale
        run: |
          if python scripts/sync_docs.py --check; then
            echo "Docs al dia; sin cambios."
            exit 0
          fi
          # Drift de docs detectado en push a main. La causa habitual es una
          # carrera con un release: semantic-release pushea el bump de version
          # entre la creacion de un PR y su merge, dejando el pin del README
          # con la version anterior. El sync es determinista (regenera desde la
          # fuente de verdad), asi que auto-corregirlo es estrictamente mejor
          # que dejar el gate rojo para un drift operativamente inevitable.
          echo "::warning::Bloques de docs desincronizados en push a main (probable carrera con release); auto-corrigiendo..."
          python scripts/sync_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md
          git commit -m "docs: auto-sync tras carrera con release [skip ci]" || echo "Sin cambios para commitear"
          # El commit usa GITHUB_TOKEN, que NO dispara workflows push (ver
          # pages-deploy.yml) -> sin loop de pipelines. El siguiente push o
          # schedule ya parte consistente.
          git push origin HEAD:main

  build-and-test:
    name: Build and verify data
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: build-and-test

      - name: Install dependencies
        run: uv sync --extra pipeline --extra dev

      - name: Add .venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install unrar
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar

      - name: Set date key
        id: date-key
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: echo "stamp=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache staging data
        id: cache-staging
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/staging/
            data/raw/
          key: staging-data-${{ steps.date-key.outputs.stamp }}-${{ hashFiles('.github/workflows/pipeline-check.yml') }}
          restore-keys: |
            staging-data-${{ steps.date-key.outputs.stamp }}-
            staging-data-

      - name: Extract source data (conditional)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ steps.cache-staging.outputs.cache-hit }}" = "true" ]; then
            echo "Cache de staging encontrado. Ejecutando solo extractores de alta frecuencia..."
            python src/extractors/bcentral_extractor.py
            python src/extractors/res_extractor.py
            # Los demás extractores usan datos cacheados de data/staging/ y data/raw/
          else
            echo "Cache no encontrado. Ejecutando extracción completa..."
            python src/extractors/subdere_extractor.py
            python src/extractors/bcentral_extractor.py
            python src/extractors/censo_extractor.py
            python src/extractors/censo_hogares_viviendas_extractor.py
            python src/extractors/salud_extractor.py
            python src/extractors/electoral_extractor.py
            python src/extractors/mineduc_establecimientos_extractor.py
            python src/extractors/mineduc_resultados_extractor.py
            python src/extractors/siedu_extractor.py
            python src/extractors/res_extractor.py
            python src/extractors/pobreza_extractor.py
            python src/extractors/consumo_electrico_extractor.py
            python src/extractors/partidos_politicos_extractor.py
            # autoridades_electas necesita scrapling (anti-403 en camara.cl/senado.cl),
            # que no puede coexistir con el extra dev en el venv del job (conflicto
            # de click via python-semantic-release — ver pyproject.toml). Se ejecuta
            # en un entorno efímero de uv en vez del venv del proyecto. Sin esto, un
            # cache-miss produce 155 registros (0 senadores) y el paso
            # "Check build-synced files" aborta el publish diario (2026-07-19/20).
            PYTHONPATH=src uv run --no-project --with "scrapling[fetchers]" --with polars --with requests --with structlog --with tenacity --with curl_cffi python src/extractors/autoridades_electas_extractor.py
          fi

      - name: Restore versioned SINIM snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          # finanzas_municipales is monthly-cadence (see Monthly Scrape workflow),
          # not a daily extractor. Its staging snapshot is force-committed to git
          # by that workflow; make sure neither a stale actions/cache restore nor
          # a leftover fallback write can shadow the versioned copy here.
          git checkout -- data/staging/finanzas_municipales.csv data/staging/finanzas_municipales.metadata.json 2>/dev/null || true

      - name: Build outputs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python src/build_dev_db.py

      - name: Check build-synced files
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- index.html app.js README.md; then
            git diff -- index.html app.js README.md
            echo "::error::Build-synced files are stale. Run python src/build_dev_db.py and commit index.html/app.js/README.md."
            exit 1
          fi

      - name: Verify pipeline artifacts
        id: verify-pipeline
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.publish }}" == "true" ]]; then
            profile=publication
          else
            profile=readiness
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          python scripts/verify_pipeline.py --profile "$profile" \
            --allow-stale-backfills "${{ inputs.allow_stale_backfills }}"

      - name: Explain verification profile
        run: |
          if [[ "${{ steps.verify-pipeline.outputs.profile }}" == "publication" ]]; then
            {
              echo "## Verification profile"
              echo ""
              echo "Publication profile: live-source gates are enforced before artifacts can publish."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Verification profile"
              echo ""
              echo "Readiness profile: this run may pass with fallback or sample data."
              echo ""
              echo "These artifacts are suitable for CI smoke tests only. PyPI release asset upload requires a publication-profile artifact and a live-data verification guard."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write pipeline artifact provenance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = "${{ steps.verify-pipeline.outputs.profile }}"
          metadata = {
              "verification_profile": profile,
              "require_live": profile == "publication",
              "source_run_event": "${{ github.event_name }}",
              "source_run_id": "${{ github.run_id }}",
              "source_sha": "${{ github.sha }}",
              "source_ref": "${{ github.ref }}",
              "workflow": "${{ github.workflow }}",
              "publish_input": os.environ.get("PUBLISH_INPUT", "false").lower() == "true",
              # Override con el que se verifico este artefacto (ADR-016). El
              # release re-verifica con --require-live; sin este campo el
              # override aplicado al publicar (p. ej. --allow-stale-backfills ipc)
              # se perderia y el release rechazaria un artefacto ya verificado.
              "allow_stale_backfills": "${{ inputs.allow_stale_backfills }}",
          }
          Path("data/normalized/pipeline_artifact_provenance.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
        env:
          PUBLISH_INPUT: ${{ inputs.publish || 'false' }}

      - name: Run unit and contract tests
        run: python -m pytest -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: false  # Deshabilitado: migrado a badge autogenerado (coverage_badge.json)
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage badge
        run: python scripts/generate_coverage_badge.py

      - name: Generate pipeline status
        run: python scripts/pipeline_status.py

      - name: Generate freshness badge
        run: python scripts/generate_freshness_badge.py

      - name: Publish job summary
        run: |
          for report in \
            overview.md \
            hub_health.md \
            redistribution_report.md \
            provenance_report.md \
            drift_report.md \
            pipeline_status.md \
            dataset_catalog.md
          do
            cat "data/normalized/$report" >> "$GITHUB_STEP_SUMMARY"
            printf "\n\n" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload generated pipeline output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PIPELINE_ARTIFACT }}
          # P1 de la review del PR #77 (write-races): README/index/app viajan
          # en el artifact porque el build los regenera con la version y los
          # datos CORRECTOS del run — el publish los adopta. Antes solo subia
          # data/normalized/ y el publish commitaba index/app del checkout de
          # main (stale) y un README sin cambios.
          path: |
            data/normalized/
            README.md
            index.html
            app.js
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  package-quality:
    name: Package quality (${{ matrix.python-version }})
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: package-quality

      - name: Build wheel and source distribution
        run: |
          uv build
          uvx twine check dist/*

      - name: Install wheel and smoke test CLI
        run: |
          uv pip install --system --force-reinstall dist/*.whl
          python -c "from chile_hub import ChileHub; print(ChileHub)"
          chile-hub --help
          chile-hub cache status

  landing:
    name: Landing smoke test
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: landing

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Add .venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Chromium system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Download generated pipeline output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PIPELINE_ARTIFACT }}
          path: .pipeline-output/

      - name: Adopt pipeline data for landing verification
        run: |
          cp -a .pipeline-output/data/normalized/. data/normalized/

      - name: Verify landing page
        run: python scripts/verify_landing.py

  publish:
    concurrency:
      group: bot-writes-main
      cancel-in-progress: false
    name: Publish verified data
    if: github.event_name == 'schedule' || inputs.publish == true
    needs: [build-and-test, landing]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified pipeline output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PIPELINE_ARTIFACT }}
          path: .pipeline-output/

      - name: Commit refreshed artifacts
        run: |
          # Adopta los archivos regenerados por el build del run (P1 de la
          # review del PR #77): el artifact ahora incluye README/index/app
          # junto con data/normalized/. Sin esta copia, el publish commitaba
          # el README del checkout de main (stale) y el cache-buster viejo.
          cp -a .pipeline-output/data/normalized/. data/normalized/
          cp .pipeline-output/README.md .pipeline-output/index.html .pipeline-output/app.js .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README.md incluido (fix/write-races): el build regenera los bloques
          # de data (health/quality) y sin commitearlo el siguiente push o PR
          # falla el gate sync_docs --check — la clase de carrera del
          # 2026-08-13 (release piso el README con datos viejos).
          git add --all data/normalized/ index.html app.js README.md
          if git diff --cached --quiet; then
            echo "No publishable data changes."
            exit 0
          fi
          git commit -m "chore(data): daily refresh [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
