repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # data/raw/ son snapshots de auditoria solo-append (AGENTS.md, regla #3):
      # ningun hook debe reescribirlos. Ademas son binarios (xlsx/rar), donde
      # "trailing whitespace" no significa nada.
      - id: trailing-whitespace
        exclude: ^data/raw/
      - id: end-of-file-fixer
        exclude: ^data/raw/
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-json

  # Versiones single-source con CI y el lock (Plan 094): ruff == 0.16.7
  # (pyproject dev-pin), mypy == 2.3.1 con deps pineadas a uv.lock. Un pin
  # distinto por superficie hacía que el mismo código pasara en un lado y
  # fallara en otro.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        pass_filenames: false
        additional_dependencies: [polars==1.41.2, requests==2.34.2, tenacity==9.1.4]

  - repo: local
    hooks:
      - id: sync-docs
        name: sync-docs
        entry: bash -c 'make sync-docs && git add README.md AGENTS.md'
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|README\.md|AGENTS\.md|src/chile_hub/datasets\.py|src/builders/|scripts/sync_docs\.py|docs/adr/|tests/|data/dataset_catalog_config\.json|contracts/datasets/)$
      - id: pip-audit
        name: pip-audit
        # Mismos flags que CI (Plan 094): sin el ignore, este hook falla en
        # local con PYSEC-2026-2132 mientras CI pasa. Rationale del ignore en
        # pipeline-check.yml (Plan 096 lo convierte en mecanismo con expiración).
        entry: uv run pip-audit --ignore-vuln PYSEC-2026-2132
        language: system
        pass_filenames: false
        files: ^pyproject\.toml$
      - id: interrogate
        name: interrogate
        entry: uv run interrogate
        language: system
        pass_filenames: false
        files: ^src/chile_hub/
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r src/
        language: system
        pass_filenames: false
        files: ^src/
