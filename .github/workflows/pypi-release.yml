name: PyPI Release

on:
  workflow_run:
    workflows: ["Pipeline Check"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release and publish
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      released: ${{ steps.semantic-release.outputs.released }}
      ready: ${{ steps.pipeline-assets.outputs.ready }}
      run_id: ${{ steps.pipeline-assets.outputs.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install package build dependencies
        run: uv sync --extra dev

      - name: Add .venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Download verified pipeline data assets
        id: pipeline-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf data/normalized
          mkdir -p data/normalized

          # Descarga el artefacto de un run de Pipeline Check y responde si es
          # publication-grade (perfil `publication` + require_live). Solo esos
          # pueden adjuntarse a un release: los demas no verificaron la fuente
          # en vivo.
          is_publication_grade() {
            local dir="$1"
            [[ -f "$dir/pipeline_artifact_provenance.json" ]] || return 1
            python - "$dir/pipeline_artifact_provenance.json" <<'PY' || return 1
          import json, sys
          p = json.load(open(sys.argv[1], encoding="utf-8"))
          sys.exit(
              0
              if p.get("verification_profile") == "publication" and p.get("require_live") is True
              else 1
          )
          PY
          }

          try_download() {
            local candidate="$1"
            rm -rf data/normalized
            mkdir -p data/normalized
            gh run download "$candidate" --name "pipeline-output-$candidate" \
              --dir data/normalized 2>/dev/null || return 1
            is_publication_grade data/normalized
          }

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id=$(gh run list --workflow "Pipeline Check" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          fi

          if [[ -z "$run_id" ]]; then
            echo "Error: No verified pipeline data assets found."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          if try_download "$run_id"; then
            echo "Artefacto publication-grade tomado del run disparador ($run_id)."
          else
            # El run que dispara el release casi siempre es `push`, y esos
            # construyen con perfil `readiness` (sin verificacion live). Los
            # artefactos publication-grade vienen de `schedule`/`workflow_dispatch`,
            # que rara vez coinciden con commits publicables — por eso NINGUN
            # release del proyecto llego a tener assets adjuntos. Se busca hacia
            # atras el ultimo artefacto publication-grade disponible.
            echo "::notice::El run disparador no es publication-grade; buscando el ultimo que lo sea."
            found=""
            for candidate in $(gh run list --workflow "Pipeline Check" --branch main \
                --status success --limit 30 --json databaseId,event \
                --jq '.[] | select(.event=="schedule" or .event=="workflow_dispatch") | .databaseId'); do
              if try_download "$candidate"; then
                found="$candidate"
                break
              fi
            done

            if [[ -z "$found" ]]; then
              echo "::notice::No hay artefactos publication-grade disponibles (pueden haber expirado); no se adjuntan datos al release."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Artefacto publication-grade tomado del run $found."
            echo "assets_run_id=$found" >> "$GITHUB_OUTPUT"
          fi

          set +e
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          provenance = json.loads(
              Path("data/normalized/pipeline_artifact_provenance.json").read_text(encoding="utf-8")
          )
          profile = provenance.get("verification_profile")
          require_live = provenance.get("require_live")
          source_event = provenance.get("source_run_event")

          if profile != "publication" or require_live is not True:
              print(
                  "::notice::Pipeline artifact is not publication-grade "
                  f"(profile={profile!r}, require_live={require_live!r}, event={source_event!r}); "
                  "release data assets will not be attached."
              )
              sys.exit(2)
          PY
          validation_status="$?"
          set -e

          case "$validation_status" in
            0)
              python scripts/verify_pipeline.py --require-live
              echo "ready=true" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "ready=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Python semantic release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          python -m semantic_release version --skip-build --no-commit --no-tag --no-push --no-vcs-release
          after="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"

          # Detect if this is a tagged release, a manual run, or version bumped by semantic-release
          has_matching_tag="$(git tag --points-at HEAD | grep -E "^v${after}$" || true)"

          if [[ "$before" != "$after" || -n "$has_matching_tag" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$before" != "$after" ]]; then
              uv lock
              uv lock --locked
              python scripts/sync_release_artifact_version.py

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add CHANGELOG.md pyproject.toml uv.lock data/normalized/ index.html app.js
              git commit -m "chore(release): ${after} [skip ci]"
              tag="v${after}"
              git tag "$tag"
              # --atomic es obligatorio: `git push` NO es atomico por defecto y
              # empuja cada ref por separado. Sin el, una carrera con otro commit
              # de bot (refresh diario, adoption stats, monthly scrape) rechaza
              # `main` pero deja el TAG publicado. Eso bloquea el release para
              # siempre: semantic-release calcula la misma version, ve que su tag
              # ya existe y responde "already released" en cada run posterior —
              # en verde, porque los pasos de publish quedan skipped. Paso el
              # 2026-07-10 con v1.22.0 y dejo 19 dias y 58 commits sin publicar.
              git push --atomic origin HEAD:main "$tag"

              if gh release view "$tag" >/dev/null 2>&1; then
                echo "Release $tag already exists"
              else
                gh release create "$tag" --notes "Release $tag"
              fi
            else
              uv lock --locked
            fi
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$after" >> "$GITHUB_OUTPUT"
          else
            git checkout -- CHANGELOG.md pyproject.toml uv.lock
            uv lock --locked
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=$after" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check released package
        if: steps.semantic-release.outputs.released == 'true'
        run: |
          rm -rf dist/
          python -m build
          python -m twine check dist/*

      - name: Publish package to PyPI
        if: steps.semantic-release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.13.0
        with:
          skip-existing: true

      - name: Attach verified data assets to release
        if: steps.semantic-release.outputs.released == 'true' && steps.pipeline-assets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.semantic-release.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --notes "Release $tag"
          fi
          gh release upload "$tag" \
            data/normalized/chile-hub-publishable-bundle.zip \
            data/normalized/chile-hub-publishable-bundle.zip.sha256 \
            data/normalized/artifact_manifest.json \
            data/normalized/dataset_catalog.json \
            data/normalized/hub_bundle.json \
            --clobber

  hf-publish:
    name: Publish dataset to Hugging Face Hub
    needs: release
    if: needs.release.outputs.released == 'true' && needs.release.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Download verified pipeline data assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf data/normalized
          mkdir -p data/normalized

          # Reusa el run_id exacto que release ya resolvio y valido (job output
          # run_id), en vez de re-resolver "el ultimo run exitoso" de forma
          # independiente. Evita una condicion de carrera en workflow_dispatch:
          # release puede pushear un commit de release que dispare un nuevo
          # Pipeline Check run en main antes de que este job corra; re-resolver
          # aqui podria bajar un artefacto distinto al que needs.release.outputs.ready
          # efectivamente valido.
          run_id="${{ needs.release.outputs.run_id }}"

          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" \
              --name "pipeline-output-$run_id" \
              --dir data/normalized
          else
            echo "Error: No verified pipeline data assets found (release no expuso run_id)."
            exit 1
          fi

      - name: Publish to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::secret HF_TOKEN no configurado; omitiendo publicacion a Hugging Face Hub."
            exit 1
          fi
          uv pip install --system huggingface_hub
          python scripts/publish_hf_dataset.py --repo-id cortega26/chile-hub
