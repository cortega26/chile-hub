name: Diagnose MINVU via scrapling

# Workflow desechable: responde si algún fingerprint TLS (Firefox/NSS, Safari,
# Chrome reciente, Tor) o un browser stealth puede descargar catalogo.minvu.cl
# desde un runner de GitHub. Se borra tras el resultado.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: curl_cffi impersonation matrix
        run: |
          uv run --no-project --with curl_cffi python - <<'PY'
          import curl_cffi.requests as cffi
          URL = "https://catalogo.minvu.cl/cgi-bin/koha/opac-retrieve-file.pl?id=adc446143de3847f7f66d3f93b83ddf3"
          profiles = [
              "firefox147", "firefox144", "firefox133",
              "safari260", "safari184", "safari180",
              "chrome150", "chrome146", "chrome136", "chrome131",
              "edge101", "tor145",
          ]
          for profile in profiles:
              try:
                  r = cffi.get(URL, impersonate=profile, timeout=45)
                  print(f"{profile}: http={r.status_code} size={len(r.content)}")
              except Exception as exc:
                  print(f"{profile}: ERROR {type(exc).__name__}: {str(exc)[:120]}")
          PY

      - name: Install scrapling browsers
        run: uv run --no-project --with "scrapling[fetchers]" scrapling install

      - name: scrapling fetchers
        run: |
          uv run --no-project --with "scrapling[fetchers]" python - <<'PY'
          URL = "https://catalogo.minvu.cl/cgi-bin/koha/opac-retrieve-file.pl?id=adc446143de3847f7f66d3f93b83ddf3"

          print("== StealthyFetcher (stealth Chromium) ==")
          try:
              from scrapling.fetchers import StealthyFetcher
              page = StealthyFetcher.fetch(URL, headless=True, network_idle=True)
              print("StealthyFetcher:", page.status, len(page.body or b""))
          except Exception as exc:
              print("StealthyFetcher ERROR:", type(exc).__name__, str(exc)[:250])

          print("== DynamicFetcher (Playwright Chromium) ==")
          try:
              from scrapling.fetchers import DynamicFetcher
              page = DynamicFetcher.fetch(URL, headless=True, network_idle=True)
              print("DynamicFetcher:", page.status, len(page.body or b""))
          except Exception as exc:
              print("DynamicFetcher ERROR:", type(exc).__name__, str(exc)[:250])
          PY
