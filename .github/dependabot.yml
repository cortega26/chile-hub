version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    ignore:
      # duckdb 2.0 (oct-2026) eliminó `.pl()` y `fetch_arrow_table()`: rompe
      # `ChileHub.sql()` en runtime, no solo en mypy (regresión 2026-10-26).
      # Migrar exige añadir pyarrow o pandas como dependencia runtime; es una
      # decisión aparte, no un bump de grupo. Las actualizaciones de seguridad
      # no se ven afectadas por `ignore`.
      - dependency-name: "duckdb"
        update-types: ["version-update:semver-major"]
    groups:
      python-runtime:
        patterns:
          - polars
          - pyarrow
          - requests
          - platformdirs
      python-pipeline:
        patterns:
          - duckdb
          - pandas
          - xlsxwriter
          - curl_cffi
          - openpyxl
      python-dev:
        dependency-type: development
        patterns:
          - "*"
    labels:
      - dependencies
      - python
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
