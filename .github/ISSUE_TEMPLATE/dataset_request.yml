name: Solicitar un dataset
description: Pide que se agregue una fuente de datos públicos de Chile al hub.
title: "solicitud: "
labels: ["enhancement", "dataset"]
body:
  - type: markdown
    attributes:
      value: |
        Guía rápida: https://tooltician.com/chile-hub/reference/contribuir-datasets/

        Esta plantilla es para **pedir** un dato (señal de demanda). Si ya tienes la
        fuente y quieres implementarla o mantenerla, usa la plantilla
        [Aportar un dataset](https://github.com/cortega26/chile-hub/issues/new?template=dataset_contribution.yml).
  - type: textarea
    id: need
    attributes:
      label: ¿Qué dato necesitas?
      description: Descríbelo con tus palabras, como si lo pidieras en una conversación.
      placeholder: "Ej: caudales de ríos por comuna y mes."
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: ¿Para qué lo usarías?
      description: El caso de uso concreto es lo que permite priorizar la solicitud.
      placeholder: "Ej: evaluar riesgo de sequía para proyectos agrícolas en la zona central."
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: ¿Conoces una fuente oficial? (opcional)
      description: Si sabes dónde está publicado, pega la URL. Si no, no hay problema.
      placeholder: https://...
  - type: dropdown
    id: help
    attributes:
      label: ¿Puedes ayudar?
      options:
        - Solo lo solicito
        - Puedo ayudar a evaluar la fuente
        - Puedo aportar datos o implementar (usaré la plantilla "Aportar un dataset")
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto extra (opcional)
      description: Quién más lo necesita, cada cuánto se actualiza, si lo viste en otro proyecto, etc.
