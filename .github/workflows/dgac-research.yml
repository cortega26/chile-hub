name: DGAC full-history and publication contract verification

on:
  pull_request:
    paths:
      - "scripts/research_dgac_precipitaciones.py"
      - "src/extractors/precipitaciones_dgac_extractor.py"
      - "src/validation/_clima.py"
      - "scripts/verify_dgac_publication.py"
      - "contracts/datasets/precipitaciones_dgac.schema.json"
      - "data/dataset_specs/precipitaciones_dgac.json"
      - "tests/test_research_dgac_precipitaciones.py"
      - "docs/research-dgac-precipitaciones.md"
      - ".github/workflows/dgac-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dgac-research:
    name: Validate DGAC stable publishable evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install verification dependencies
        run: python -m pip install "polars>=1.44.1,<3" "pyarrow>=24" "requests>=2.34.2" "platformdirs>=4" "rich>=14"
      - name: Offline unit and contract tests
        run: python -m unittest discover -s tests -p 'test_research_dgac_precipitaciones.py' -v
      - name: Fetch staging from DGAC (143 valid historical months)
        run: python src/extractors/precipitaciones_dgac_extractor.py
      - name: Verify contract and prepare production CSV and Parquet
        run: |
          python scripts/verify_dgac_publication.py
          python -m json.tool data/normalized/precipitaciones_dgac.metadata.json > /dev/null
      - name: Archive verified production-ready evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dgac-precipitations-publishable-2013-2026
          path: |
            data/normalized/precipitaciones_dgac.csv
            data/normalized/precipitaciones_dgac.parquet
            data/normalized/precipitaciones_dgac.metadata.json
          if-no-files-found: error
          retention-days: 30
